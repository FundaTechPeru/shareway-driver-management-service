spring.application.name=driver-management-service

server.port=${SERVER_PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/driver_management_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:shareway}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:shareway}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# JWT_SECRET is required in production. Outside the dev/test/local profiles the service refuses to
# start without it (or with the development example value); see JwtSecretValidator. The development
# default lives in application-dev.properties, so run locally with the "dev" profile active.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=60
app.storage.path=${STORAGE_PATH:./storage}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://localhost:3000}

management.endpoints.web.exposure.include=health,info
